# 便携 Redis 的参考配置（start_silent.py 并不会用它，见下面 dir 那行说明）
bind 127.0.0.1
port 6379
# 数据目录：不写死别人的电脑路径（写死了换台机器就会因为目录不存在起不来）。
# 这里的 . 是「启动 redis-server 时所在的那个目录」，从本文件所在目录拉起最稳。
# 真正跑站点时，start_silent.py 会用命令行 --dir 指到
#   %LOCALAPPDATA%\yamtrack\redis-data
# 覆盖掉这里的值（Redis 的命令行参数优先级高于配置文件）。
dir ./
appendonly no
protected-mode no
databases 16
save 900 1
